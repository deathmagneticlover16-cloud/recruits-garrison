buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.54' }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'
version = '0.2.0'
group = 'dev.raybert.garrison'
base { archivesName = 'recruits-garrison-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { garrison { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { garrison { source sourceSets.main } } }
    }
}
repositories {
    flatDir { dirs 'libs' }
    mavenCentral()
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf('local:recruits:1.20.1-1.15.2')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { manifest { attributes 'MixinConfigs': 'garrison.mixins.json' } }
jar.finalizedBy('reobfJar')
tasks.register('assignmentTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.raybert.garrison.AssignmentPlannerTest'
}
check.dependsOn assignmentTest
tasks.register('persistenceTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.raybert.garrison.PersistenceTest'
}
check.dependsOn persistenceTest
tasks.register('arrivalTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.raybert.garrison.PostArrivalTest'
}
check.dependsOn arrivalTest
tasks.register('paletteTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.raybert.garrison.GarrisonPaletteTest'
}
check.dependsOn paletteTest
